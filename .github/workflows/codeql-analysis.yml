name: CodeQL Analysis

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.repository == 'jonardGIT/cityzen-dashboard' || github.repository == 'Xypes13/xypes-cityzen-dashboard'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build source project
        if: github.repository == 'jonardGIT/cityzen-dashboard'
        run: npm run build

      - name: Verify standalone runtime exists
        if: github.repository == 'Xypes13/xypes-cityzen-dashboard'
        run: test -f .next/standalone/server.js

      - name: Analyze
        uses: github/codeql-action/analyze@v3
